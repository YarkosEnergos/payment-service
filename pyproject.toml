[project]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing service: FastAPI, PostgreSQL, RabbitMQ (FastStream), outbox pattern"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: tests that need Docker (testcontainers)"]

[tool.ruff]
src = ["src"]
line-length = 89
target-version = "py312"
lint.select = [
    "FAST", "ASYNC", "ANN", "S", "B", "A", "COM", "C4",
    "T10", "EM", "EXE", "ISC", "ICN", "INP", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TID",
    "TC", "ARG", "PTH", "FLY", "I", "N", "PERF", "E", "W", "F", "PLC", "PLE", "PLR", "PLW", "UP", "FURB",
    "LOG",
    "RUF",
]
lint.ignore = ["RUF100", "PLR0"]
lint.fixable = ["ALL"]
lint.unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**" = ["ARG", "S101", "SLF001", "PLR2004"]
"src/infra/postgres/alembic/**" = ["INP001"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src", "tests", "tools"]
